# Stub CI mirroring rocketsingh's ci.yml shape: a dynamic test matrix (only
# changed services get a leg). Tests fail on a line `CI: fail`.
name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base:
        required: true
        type: string
      all:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.plan.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ inputs.base }}
          REF: ${{ inputs.ref }}
          RUN_ALL: ${{ inputs.all }}
        run: |
          CHANGED=$(git diff --name-only "$BASE" "$REF")
          M="["; SEP=""
          for svc in svc-a svc-b; do
            if [[ "$RUN_ALL" == "true" ]] || grep -q "^$svc/" <<< "$CHANGED"; then M="$M$SEP{\"svc\":\"$svc\"}"; SEP=","; fi
          done
          echo "test-matrix=$M]" >> "$GITHUB_OUTPUT"; echo "matrix: $M]"

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.test-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: |
          sleep 5
          if grep -rqx "CI: fail" "${{ matrix.svc }}"; then echo "::error::${{ matrix.svc }} failed"; exit 1; fi
          echo "${{ matrix.svc }} passed"
