# Stub CI, called only by merge-queue.yml. A service's "tests" fail when any
# file under it contains the line `CI: fail`; only changed services are tested.
name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the queue's batch commit)
        required: true
        type: string
      base:
        description: main commit the batch was built on
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      svc-a: ${{ steps.diff.outputs.svc-a }}
      svc-b: ${{ steps.diff.outputs.svc-b }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ inputs.base }}
          REF: ${{ inputs.ref }}
        run: |
          CHANGED=$(git diff --name-only "$BASE" "$REF")
          echo "Changed files:"; echo "$CHANGED"
          for svc in svc-a svc-b; do
            if grep -q "^$svc/" <<< "$CHANGED"; then echo "$svc=true" >> "$GITHUB_OUTPUT"; else echo "$svc=false" >> "$GITHUB_OUTPUT"; fi
          done

  test:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [svc-a, svc-b]
    steps:
      - name: Skip check
        id: should-run
        env:
          A: ${{ needs.detect-changes.outputs.svc-a }}
          B: ${{ needs.detect-changes.outputs.svc-b }}
        run: |
          case "${{ matrix.svc }}" in svc-a) RUN="$A" ;; svc-b) RUN="$B" ;; esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.svc }} changed: $RUN"
      - uses: actions/checkout@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Test
        if: steps.should-run.outputs.run == 'true'
        run: |
          sleep 10
          if grep -rqx "CI: fail" "${{ matrix.svc }}"; then
            echo "::error::${{ matrix.svc }} tests failed (found 'CI: fail')"
            exit 1
          fi
          echo "${{ matrix.svc }} tests passed"
